<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Coast Cover Studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">NEON COAST</div>
      <div class="brand-badge">Cover Studio</div>
    </div>
    <div class="header-actions">
      <button id="btn-undo" class="btn-icon" title="Undo (Ctrl+Z)" disabled>
        <span>↶</span> Undo
      </button>
      <button id="btn-redo" class="btn-icon" title="Redo (Ctrl+Y)" disabled>
        <span>↷</span> Redo
      </button>
      <button id="btn-sample-pier" class="btn-icon">Sample: Pier</button>
      <button id="btn-sample-boulevard" class="btn-icon">Sample: Boulevard</button>
    </div>
  </header>

  <main class="app-container">
    <div class="preview-stage">
      <div class="canvas-viewport">
        <canvas id="cover-canvas" width="1080" height="1080"></canvas>
      </div>
      <div class="viewport-hint">Drag canvas to pan active panel · Mouse wheel or slider to zoom</div>
    </div>

    <aside class="controls-sidebar">
      <!-- Layout Section -->
      <section class="control-section">
        <div class="section-title">
          <span>📐</span> Poster Layout
        </div>
        <div class="options-grid" id="layout-options">
          <button class="btn-option active" data-layout="four_grid">4-Panel Grid</button>
          <button class="btn-option" data-layout="hero_three">Hero & Three</button>
          <button class="btn-option" data-layout="full_bleed">Full Bleed</button>
          <button class="btn-option" data-layout="nine_grid">9-Panel Grid</button>
          <button class="btn-option" data-layout="tilted_snapshot">Tilted Snapshot</button>
          <button class="btn-option" data-layout="story_strip">Story Strip</button>
        </div>
      </section>

      <!-- Color Grade Section -->
      <section class="control-section">
        <div class="section-title">
          <span>🎨</span> Color Grade
        </div>
        <div class="options-grid" id="grade-options">
          <button class="btn-option active" data-grade="sunset">Sunset Map</button>
          <button class="btn-option" data-grade="neon_night">Neon Night</button>
          <button class="btn-option" data-grade="golden_hour">Golden Hour</button>
          <button class="btn-option" data-grade="teal_orange">Teal & Orange</button>
          <button class="btn-option" data-grade="halftone">B&W Halftone</button>
        </div>
      </section>

      <!-- Lettering & Captions Section -->
      <section class="control-section">
        <div class="section-title">
          <span>✍️</span> Lettering & Titles
        </div>
        <div class="field-group">
          <label class="field-label" for="input-title">Title (Anton Headline)</label>
          <input type="text" id="input-title" class="text-input" value="SUNSET HEIST" maxlength="32">
        </div>
        <div class="field-group">
          <label class="field-label" for="input-subtitle">Subtitle (Pacifico Neon Script)</label>
          <input type="text" id="input-subtitle" class="text-input" value="Vice City Nights" maxlength="40">
        </div>
        <div class="field-group">
          <label class="field-label" for="input-badge">Badge Ribbon Text</label>
          <input type="text" id="input-badge" class="text-input" value="VICE CITY NIGHTS" maxlength="30">
        </div>
      </section>

      <!-- Panel Crop & Transform -->
      <section class="control-section">
        <div class="section-title">
          <span>🔍</span> Panel Adjustments
        </div>
        <div class="field-group">
          <label class="field-label">Active Panel: <span id="active-panel-num">1</span></label>
          <div class="options-grid-3" id="panel-selector-group">
            <!-- Dynamically populated or buttons 1..9 -->
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="slider-zoom">
            Zoom Scale <span id="label-zoom-val">100%</span>
          </label>
          <input type="range" id="slider-zoom" class="range-slider" min="50" max="300" value="100">
        </div>
        <div class="field-group">
          <label class="field-label" for="slider-pan-x">
            Pan X <span id="label-pan-x-val">0</span>
          </label>
          <input type="range" id="slider-pan-x" class="range-slider" min="-500" max="500" value="0">
        </div>
        <div class="field-group">
          <label class="field-label" for="slider-pan-y">
            Pan Y <span id="label-pan-y-val">0</span>
          </label>
          <input type="range" id="slider-pan-y" class="range-slider" min="-500" max="500" value="0">
        </div>
      </section>

      <!-- Extras & Effects -->
      <section class="control-section">
        <div class="section-title">
          <span>⭐</span> Extras & Atmosphere
        </div>
        <div class="field-group">
          <label class="field-label">Wanted Heat Level</label>
          <div class="star-rating-row" id="heat-stars">
            <button class="star-btn active" data-star="1">★</button>
            <button class="star-btn active" data-star="2">★</button>
            <button class="star-btn active" data-star="3">★</button>
            <button class="star-btn active" data-star="4">★</button>
            <button class="star-btn active" data-star="5">★</button>
          </div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Badge Ribbon</span>
          <label class="switch">
            <input type="checkbox" id="toggle-badge" checked>
            <span class="slider-switch"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Film Grain</span>
          <label class="switch">
            <input type="checkbox" id="toggle-grain" checked>
            <span class="slider-switch"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Vignette Falloff</span>
          <label class="switch">
            <input type="checkbox" id="toggle-vignette" checked>
            <span class="slider-switch"></span>
          </label>
        </div>
      </section>

      <!-- Photo Import -->
      <section class="control-section">
        <div class="section-title">
          <span>📷</span> Photo Source
        </div>
        <div class="photo-actions">
          <label class="file-upload-btn" for="input-file">
            📁 Upload Local Photo
            <input type="file" id="input-file" class="file-input-hidden" accept="image/*">
          </label>
        </div>
      </section>

      <!-- Export Section -->
      <section class="control-section">
        <div class="section-title">
          <span>💾</span> Export Artwork
        </div>
        <div class="btn-export-group">
          <button id="btn-export-1080-square" class="btn-export">1080×1080 (Square)</button>
          <button id="btn-export-1080-story" class="btn-export">1080×1350 (Story)</button>
          <button id="btn-export-1920-land" class="btn-export">1920×1080 (Landscape)</button>
          <button id="btn-export-all" class="btn-export-all">Export All (3 Sizes)</button>
        </div>
      </section>
    </aside>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
